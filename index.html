<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบทดสอบ: วิทยาศาสตร์และจิตวิทยาการศึกษา</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; -webkit-tap-highlight-color: transparent; }
        .hidden { display: none !important; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); border-left-color: #10b981; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        input[type="radio"]:checked + span { color: #1d4ed8; font-weight: 600; }
        .option-card:has(input[type="radio"]:checked) { border-color: #3b82f6; background-color: #eff6ff; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 pb-10">

    <!-- Sticky Timer (ซ่อนไว้ก่อน) -->
    <div id="timerWrapper" class="hidden sticky top-0 z-50 bg-white/90 backdrop-blur-sm border-b border-slate-200 shadow-sm py-2 px-4 flex justify-between items-center">
        <span class="text-sm font-bold text-slate-700 truncate" id="exam-title-display">📝 สอบเก็บคะแนน</span>
        <span class="inline-flex items-center bg-blue-100 text-blue-700 font-semibold px-3 py-1 rounded-full text-sm">
            ⏱️ <span id="time-display" class="ml-1">00:00</span>
        </span>
    </div>

    <div class="max-w-3xl mx-auto py-4 px-3 sm:px-6">
        
        <!-- Header -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-5 mb-6 text-center">
            <h1 class="text-xl md:text-2xl font-bold text-blue-700 mb-2">วิทยาศาสตร์และจิตวิทยาการศึกษา</h1>
            <p class="text-sm text-slate-500">ระบบประเมินผลอัตโนมัติด้วย Keyword Matching</p>
        </div>

        <!-- หน้าเลือกชุดข้อสอบ -->
        <div id="selectionScreen" class="space-y-4">
            <h2 class="text-lg font-bold text-slate-800 text-center mb-4">📚 กรุณาเลือกชุดข้อสอบที่ต้องการทำ</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <button onclick="startExam(0)" class="bg-white border-2 border-blue-200 hover:border-blue-500 hover:bg-blue-50 rounded-2xl p-6 text-left transition shadow-sm group">
                    <h3 class="text-xl font-bold text-blue-700 group-hover:text-blue-800">ชุดที่ 1</h3>
                    <p class="text-slate-500 text-sm mt-1">ปรนัย 10 ข้อ | อัตนัย 10 ข้อ</p>
                </button>
                <button onclick="startExam(1)" class="bg-white border-2 border-indigo-200 hover:border-indigo-500 hover:bg-indigo-50 rounded-2xl p-6 text-left transition shadow-sm group">
                    <h3 class="text-xl font-bold text-indigo-700 group-hover:text-indigo-800">ชุดที่ 2</h3>
                    <p class="text-slate-500 text-sm mt-1">ปรนัย 10 ข้อ | อัตนัย 10 ข้อ</p>
                </button>
                <button onclick="startExam(2)" class="bg-white border-2 border-emerald-200 hover:border-emerald-500 hover:bg-emerald-50 rounded-2xl p-6 text-left transition shadow-sm group">
                    <h3 class="text-xl font-bold text-emerald-700 group-hover:text-emerald-800">ชุดที่ 3</h3>
                    <p class="text-slate-500 text-sm mt-1">ปรนัย 10 ข้อ | อัตนัย 10 ข้อ</p>
                </button>
                <button onclick="startExam(3)" class="bg-white border-2 border-amber-200 hover:border-amber-500 hover:bg-amber-50 rounded-2xl p-6 text-left transition shadow-sm group">
                    <h3 class="text-xl font-bold text-amber-700 group-hover:text-amber-800">ชุดที่ 4</h3>
                    <p class="text-slate-500 text-sm mt-1">ปรนัย 10 ข้อ | อัตนัย 10 ข้อ</p>
                </button>
            </div>
        </div>

        <!-- หน้าทำข้อสอบ -->
        <form id="examForm" class="hidden space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-blue-600 text-white p-3 sm:p-4 font-semibold text-base sm:text-lg">ตอนที่ 1: ปรนัย (10 ข้อ)</div>
                <div id="mc-container" class="p-4 sm:p-6 space-y-6"></div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                <div class="bg-emerald-600 text-white p-3 sm:p-4 font-semibold text-base sm:text-lg">ตอนที่ 2: อัตนัย (10 ข้อ)</div>
                <div id="essay-container" class="p-4 sm:p-6 space-y-6"></div>
            </div>

            <div class="pt-4 pb-8">
                <button type="submit" id="submitBtn" class="w-full bg-emerald-600 active:bg-emerald-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition duration-200 text-lg">
                    ส่งข้อสอบและดูผลคะแนน
                </button>
            </div>
        </form>

        <!-- โหลดดิงสกรีน -->
        <div id="loadingSection" class="hidden text-center py-24 px-4 bg-white rounded-2xl shadow-sm border border-slate-200 mt-6">
            <div class="spinner mb-6"></div>
            <h2 class="text-xl font-bold text-emerald-600 mb-2">กำลังประมวลผลคำตอบ...</h2>
            <p class="text-sm text-slate-500">ระบบกำลังวิเคราะห์ความถูกต้อง</p>
        </div>

        <!-- หน้าแสดงผลลัพธ์ -->
        <div id="resultsSection" class="hidden space-y-6 mt-6">
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 text-center">
                <h2 class="text-2xl font-bold text-slate-800 mb-1" id="result-title">ผลการทดสอบ</h2>
                <div class="text-5xl font-extrabold text-blue-600 my-3" id="mc-score">0 / 10</div>
                <p class="text-slate-500 text-sm">คะแนนปรนัย</p>
            </div>

            <div id="mc-review-container" class="space-y-3"></div>
            <div id="essay-review-container" class="space-y-3"></div>
            
            <div class="text-center pt-6 pb-12">
                <button onclick="location.reload()" class="w-full sm:w-auto bg-slate-200 active:bg-slate-300 text-slate-700 font-bold py-4 px-8 rounded-2xl transition">กลับไปหน้าเลือกชุดข้อสอบ</button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ข้อมูลข้อสอบทั้งหมด 4 ชุด
        // ==========================================
        const examData = [
            // ================= ชุดที่ 1 =================
            {
                title: "ชุดที่ 1",
                mc: [
                    { q: "คำว่า Science ในภาษาอังกฤษ หรือ Scientia ในภาษาลาติน มีความหมายตรงกับข้อใดมากที่สุด?", choices: ["ปรากฏการณ์ธรรมชาติ", "ความรู้", "การทดลอง", "ความอยากรู้อยากเห็น"], ans: 1, rationale: "รากศัพท์ดั้งเดิมแปลว่า ความรู้ (Knowledge)" },
                    { q: "ทักษะกระบวนการทางวิทยาศาสตร์ (SAPA) ขั้นพื้นฐาน มีจำนวนกี่ทักษะ และเหมาะสมกับผู้เรียนในวัยใด?", choices: ["5 ทักษะ เหมาะสำหรับปฐมวัย", "5 ทักษะ เหมาะสำหรับมัธยมวัย", "8 ทักษะ เหมาะสำหรับปฐมวัย", "8 ทักษะ เหมาะสำหรับมัธยมวัย"], ans: 2, rationale: "ทักษะพื้นฐานมีทั้งหมด 8 ทักษะ ออกแบบมาให้เหมาะกับเด็กปฐมวัย" },
                    { q: "ในการทดลองวิทยาศาสตร์ สิ่งที่เป็น 'สาเหตุ' ที่เราต้องการศึกษาเพื่อดูว่าส่งผลจริงหรือไม่ คือตัวแปรชนิดใด?", choices: ["ตัวแปรตาม (Dependent Variable)", "ตัวแปรควบคุม (Controlled Variable)", "ตัวแปรต้น หรือ ตัวแปรอิสระ (Independent Variable)", "ตัวแปรแวดล้อม"], ans: 2, rationale: "ตัวแปรต้นคือสิ่งที่เป็น 'สาเหตุ' ที่เราต้องการทดลอง" },
                    { q: "การประเมินผลแบบ Formative Assessment มีลักษณะและเป้าหมายหลักตามข้อใด?", choices: ["ประเมินเพื่อพัฒนาผู้เรียนระหว่างการเรียน", "ประเมินเพื่อตัดสินผลลัพธ์สุดท้าย", "ประเมินด้วยแฟ้มสะสมงานเพื่อเก็บคะแนน", "ประเมินคุณภาพสื่อด้วยผู้เชี่ยวชาญ"], ans: 0, rationale: "Formative เน้นการพัฒนาระหว่างทาง มีความยืดหยุ่น และไม่เป็นทางการ" },
                    { q: "ตามกระบวนการเกิดการเรียนรู้ 6 ขั้นตอน เมื่อมีสิ่งเร้ามากระทบประสาทสัมผัส (Sensation) ขั้นตอนต่อไปคืออะไร?", choices: ["การเกิดความคิดรวบยอด (Conception)", "การรับรู้ (Perception)", "การเรียนรู้ (Learning)", "พฤติกรรมตอบสนอง (Response)"], ans: 1, rationale: "หลังจากรับสัมผัส จะมีการส่งกระแสประสาทไปยังสมอง เกิดเป็นการรับรู้ (Perception)" },
                    { q: "นักเรียนที่ชอบวาด Mind Map ชอบนั่งหน้าชั้นเรียน และจดจำด้วยภาพ มีรูปแบบการเรียนรู้ (Learning Style) แบบใด?", choices: ["Auditory (การฟัง)", "Kinesthetic (การปฏิบัติ)", "Visual (การมองเห็น)", "Logical (ตรรกะ)"], ans: 2, rationale: "Visual คือรูปแบบการเรียนรู้ที่เน้นการมองเห็น การใช้ภาพ" },
                    { q: "บุคคลที่มีความสามารถเป็นผู้นำ ทำงานกลุ่มได้ดี เข้าใจผู้อื่น จัดอยู่ในพหุปัญญาด้านใด?", choices: ["ด้านเข้าใจตนเอง", "ด้านมนุษยสัมพันธ์", "ด้านภาษา", "ด้านตรรกะ"], ans: 1, rationale: "Interpersonal (มนุษยสัมพันธ์) คือปัญญาด้านการเข้าใจผู้อื่น และทำงานเป็นทีม" },
                    { q: "ในการหาค่า IOC หากผู้เชี่ยวชาญให้คะแนน -1 หมายความว่าอย่างไร?", choices: ["แน่ใจว่าสอดคล้อง", "ไม่แน่ใจว่าสอดคล้องหรือไม่", "แน่ใจว่าไม่สอดคล้อง", "แบบทดสอบผ่านเกณฑ์"], ans: 2, rationale: "คะแนน -1 หมายถึง แน่ใจว่าไม่สอดคล้องกับวัตถุประสงค์" },
                    { q: "เนื้อหาเรื่อง 'แรงไฟฟ้า และ วงจรไฟฟ้า' จัดอยู่ในโครงสร้างวิทยาศาสตร์กายภาพชั้นใด?", choices: ["ป.4", "ป.5", "ป.6", "ม.1"], ans: 2, rationale: "ป.6 จะเรียนรู้เรื่องระบบที่ซับซ้อน เช่น ไฟฟ้า" },
                    { q: "จุดโฟกัสสำคัญของการทำ IOC 'แบบทดสอบ' ที่ต่างจากใบความรู้ คือข้อใด?", choices: ["ความถูกต้องของเนื้อหา", "ระดับพฤติกรรมที่ต้องการวัด", "ความยากง่ายของภาษา", "ความสวยงามของการออกแบบ"], ans: 1, rationale: "แบบทดสอบต้องดูว่าวัด 'ระดับพฤติกรรม' ได้ตรงตามที่ออกแบบไว้หรือไม่" }
                ],
                essay: [
                    { q: "จงอธิบายความแตกต่างระหว่าง Formative Assessment และ Summative Assessment", keywords: ["ระหว่าง", "พัฒนา", "ไม่เป็นทางการ", "ปลายทาง", "ตัดสิน", "เป็นทางการ", "ผลสัมฤทธิ์"], model: "Formative ประเมินระหว่างทาง แบบไม่เป็นทางการ เพื่อพัฒนาผู้เรียน ส่วน Summative ประเมินปลายทาง เพื่อตัดสินผลสัมฤทธิ์" },
                    { q: "ตัวแปรต้น (Independent) และ ตัวแปรควบคุม (Controlled) มีหน้าที่ต่างกันอย่างไร?", keywords: ["สาเหตุ", "ต้องการ", "ควบคุม", "เหมือนกัน", "คงที่", "แวดล้อม", "ปัจจัย", "คลาดเคลื่อน"], model: "ตัวแปรต้นคือสิ่งที่เป็นสาเหตุที่เราต้องการศึกษา ส่วนตัวแปรควบคุมคือปัจจัยอื่นๆ ที่ต้องควบคุมให้เหมือนกันเพื่อไม่ให้ผลคลาดเคลื่อน" },
                    { q: "ทักษะกระบวนการทางวิทยาศาสตร์ขั้นพื้นฐาน และขั้นสูง มีจำนวนต่างกันอย่างไร และเหมาะกับวัยใด?", keywords: ["พื้นฐาน", "8", "ปฐมวัย", "สูง", "บูรณาการ", "5", "มัธยมวัย", "มัธยม"], model: "ทักษะขั้นพื้นฐานมี 8 ทักษะ เหมาะกับเด็กปฐมวัย ส่วนทักษะขั้นสูง (บูรณาการ) มี 5 ทักษะ เหมาะกับเด็กมัธยมวัย" },
                    { q: "จากกระบวนการเกิดการเรียนรู้ 'การรับรู้ (Perception)' และ 'ความคิดรวบยอด (Conception)' สัมพันธ์กันอย่างไร?", keywords: ["รับรู้", "กระแสประสาท", "สมอง", "แปลผล", "ความหมาย", "เข้าใจ", "รวบยอด"], model: "เมื่อรับสัมผัสและส่งกระแสประสาทไปสมอง จะเกิดการรับรู้ จากนั้นสมองจะทำการแปลผลสิ่งนั้นจนเกิดเป็นความเข้าใจหรือความคิดรวบยอด" },
                    { q: "จากการคำนวณ IOC หากผู้เชี่ยวชาญ 5 ท่าน ให้คะแนน: +1, 0, +1, -1, +1 ข้อสอบข้อนี้ผ่านเกณฑ์หรือไม่? เพราะเหตุใด?", keywords: ["ไม่ผ่าน", "รวม", "2", "หาร", "5", "0.4", "น้อยกว่า", "0.5"], model: "ไม่ผ่านเกณฑ์ เพราะผลรวมคะแนนคือ 2 นำไปหารจำนวนผู้เชี่ยวชาญ 5 ท่าน จะได้ 0.4 ซึ่งน้อยกว่าเกณฑ์ที่กำหนดคือ 0.5" },
                    { q: "หากต้องการจัดกิจกรรมให้เด็กที่มีพหุปัญญา 'ด้านร่างกาย' และ 'ด้านธรรมชาติ' โดดเด่น ควรจัดลักษณะใด?", keywords: ["สำรวจ", "นอกห้องเรียน", "สิ่งแวดล้อม", "ธรรมชาติ", "ปฏิบัติ", "เคลื่อนไหว", "ร่างกาย", "หยิบจับ", "กิจกรรม"], model: "ควรจัดกิจกรรมที่ให้ผู้เรียนได้ออกไปสำรวจธรรมชาตินอกห้องเรียน และได้ลงมือปฏิบัติ เคลื่อนไหวร่างกาย หรือหยิบจับสิ่งต่างๆ" },
                    { q: "ผู้เรียนที่มีรูปแบบการเรียนรู้แบบ Auditory (การฟัง) ควรใช้สื่อหรือกิจกรรมประเภทใด?", keywords: ["ฟัง", "เสียง", "พูดคุย", "สนทนา", "บรรยาย", "อภิปราย", "เทป", "พอดแคสต์"], model: "ควรใช้สื่อประเภทเสียง เทปบันทึกเสียง หรือกิจกรรมที่เน้นการฟังบรรยาย การพูดคุย และอภิปรายแลกเปลี่ยนความคิดเห็น" },
                    { q: "การหาค่า IOC ของ 'ใบความรู้' และ 'แบบทดสอบ' จุดโฟกัสของผู้เชี่ยวชาญต่างกันอย่างไร?", keywords: ["ความรู้", "เนื้อหา", "ถูกต้อง", "ครอบคลุม", "ทดสอบ", "พฤติกรรม", "ระดับ", "วัด"], model: "ใบความรู้โฟกัสที่ความถูกต้องและครอบคลุมของเนื้อหา ส่วนแบบทดสอบต้องโฟกัสว่าสามารถวัดระดับพฤติกรรมได้ตรงตามที่ออกแบบไว้หรือไม่" },
                    { q: "ตามโครงสร้างหลักสูตร ป.4-ป.6 เนื้อหา 'การเปลี่ยนแปลงของสาร' และ 'เสียง' อยู่ชั้นใด?", keywords: ["ป.5", "ประถมศึกษาปีที่ 5", "พลวัต", "dynamics"], model: "อยู่ในระดับชั้น ป.5 (หมวดพลวัต หรือ Dynamics)" },
                    { q: "ตามจิตวิทยาการศึกษา 'การเรียนรู้' หมายถึงอะไร? และสิ่งใดที่ไม่นับว่าเป็นการเรียนรู้?", keywords: ["เปลี่ยนแปลง", "พฤติกรรม", "ถาวร", "ประสบการณ์", "ชั่วคราว", "เจ็บป่วย", "สัญชาตญาณ"], model: "การเรียนรู้คือการเปลี่ยนแปลงพฤติกรรมอย่างค่อนข้างถาวรจากประสบการณ์ สิ่งที่ไม่นับว่าเป็นการเรียนรู้คือพฤติกรรมชั่วคราว อาการเจ็บป่วย หรือสัญชาตญาณ" }
                ]

                    // คำนวณ % ถ้าเจอคำสำคัญ >= 50% ให้คะแนนเต็ม 100%
                    let targetCount = Math.ceil(q.keywords.length * 0.5); 
                    let scorePercent = Math.min(Math.round((matchCount / targetCount) * 100), 100);
                    
                    let badgeColor = scorePercent >= 80 ? 'bg-green-100 text-green-800' : (scorePercent >= 50 ? 'bg-yellow-100 text-yellow-800' : 'bg-red-100 text-red-800');
                    let feedbackTxt = scorePercent >= 80 ? "เยี่ยมมาก! ครอบคลุมประเด็นสำคัญ" : (scorePercent >= 50 ? "พอใช้ได้ แต่ยังขาดรายละเอียดบางส่วน" : "เนื้อหายังไม่ค่อยตรงกับประเด็น");

                    essayReview.innerHTML += `
                        <div class="p-3 sm:p-4 rounded-xl border border-slate-200 bg-white">
                            <p class="font-medium text-sm sm:text-base mb-2"><span class="mr-1 text-emerald-600">${index + 11}.</span>${q.q}</p>
                            <div class="bg-slate-50 p-2 sm:p-3 rounded-lg mb-2 border border-slate-100">
                                <p class="text-xs text-slate-500 mb-1">📝 คำตอบของคุณ:</p>
                                <p class="text-sm text-slate-800 leading-relaxed">${formData.get(`essay-${index}`).trim()}</p>
                            </div>
                            
                            <div class="flex flex-wrap items-center gap-2 mb-2">
                                <span class="px-2 py-0.5 rounded text-xs font-bold ${badgeColor}">ความสมบูรณ์: ${scorePercent}%</span>
                                <span class="text-xs text-slate-500">(${feedbackTxt})</span>
                            </div>
                            
                            ${matchedWords.length > 0 ? `<p class="text-xs text-emerald-600 mb-2"><b>คำสำคัญที่พบ:</b> ${matchedWords.join(', ')}</p>` : `<p class="text-xs text-red-500 mb-2">ไม่พบคำสำคัญที่ตรงกับแนวคำตอบ</p>`}
                            
                            <p class="text-sm text-emerald-800 bg-emerald-50 p-2 sm:p-3 rounded-lg border border-emerald-100 leading-relaxed">✅ <b>แนวคำตอบ:</b> ${q.model}</p>
                        </div>
                    `;
                });

                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('resultsSection').classList.remove('hidden');
                window.scrollTo({ top: 0, behavior: 'smooth' });

            }, 1500); // จำลองโหลด 1.5 วินาที
        });
    </script>
</body>
</html>
